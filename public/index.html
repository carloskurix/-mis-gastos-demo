<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis Gastos</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="wrap">
  <header>
    <h1>Mis Gastos</h1>
    <p class="sub">Tu registro mensual, simple y al día.</p>
  </header>

  <p id="msg" class="msg" role="status" aria-live="polite" hidden></p>

  <!-- Autenticación -->
  <section id="authView" class="card" hidden>
    <h2 id="authTitle">Iniciar sesión</h2>
    <form id="authForm">
      <label for="name">Nombre <span class="hint">(solo para crear cuenta)</span></label>
      <input id="name" name="name" type="text" autocomplete="name" placeholder="Tu nombre">
      <label for="email">Correo</label>
      <input id="email" name="email" type="email" autocomplete="email" required placeholder="tu@correo.com">
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required minlength="6" placeholder="Mínimo 6 caracteres">
      <button type="submit" class="primary" id="authBtn">Entrar</button>
    </form>
    <button type="button" class="link" id="toggleAuth">¿No tienes cuenta? Crea una</button>
  </section>

  <!-- App -->
  <section id="appView" hidden>
    <div class="userbar">
      <span id="userName"></span>
      <button type="button" class="link" id="logoutBtn">Cerrar sesión</button>
    </div>

    <section class="card total-card" aria-label="Total del mes">
      <div class="month-nav">
        <button type="button" id="prevMonth" aria-label="Mes anterior">‹</button>
        <h2 id="monthLabel"></h2>
        <button type="button" id="nextMonth" aria-label="Mes siguiente">›</button>
      </div>
      <p class="total" id="monthTotal">$0.00</p>
      <p class="total-sub" id="monthCount">0 gastos este mes</p>
    </section>

    <section class="card" aria-label="Por categoría">
      <h3>Por categoría</h3>
      <div id="byCategory"></div>
    </section>

    <section class="card" aria-label="Agregar gasto">
      <h3 id="formTitle">Agregar gasto</h3>
      <form id="expenseForm">
        <input type="hidden" id="expenseId">
        <label for="description">¿En qué gastaste?</label>
        <input id="description" type="text" required maxlength="120" placeholder="Ej. Super, gasolina, tacos">
        <div class="row">
          <div>
            <label for="amount">Monto (MXN)</label>
            <input id="amount" type="number" required min="0.01" step="0.01" inputmode="decimal" placeholder="0.00">
          </div>
          <div>
            <label for="category">Categoría</label>
            <select id="category">
              <option>Comida</option>
              <option>Transporte</option>
              <option>Casa</option>
              <option>Ocio</option>
              <option>Salud</option>
              <option>Otros</option>
            </select>
          </div>
        </div>
        <label for="date">Fecha</label>
        <input id="date" type="date" required>
        <div class="row">
          <button type="submit" class="primary" id="saveBtn">Guardar gasto</button>
          <button type="button" id="cancelEdit" hidden>Cancelar</button>
        </div>
      </form>
    </section>

    <section class="card" aria-label="Buscar y filtrar">
      <div class="row">
        <div>
          <label for="search">Buscar</label>
          <input id="search" type="search" placeholder="Buscar gasto...">
        </div>
        <div>
          <label for="filterCategory">Categoría</label>
          <select id="filterCategory">
            <option>Todas</option>
            <option>Comida</option>
            <option>Transporte</option>
            <option>Casa</option>
            <option>Ocio</option>
            <option>Salud</option>
            <option>Otros</option>
          </select>
        </div>
      </div>
    </section>

    <section aria-label="Lista de gastos">
      <ul id="expenseList" class="list"></ul>
      <p id="emptyState" class="empty" hidden>Todavía no hay gastos este mes. Agrega el primero arriba.</p>
    </section>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
