services:
  - type: web
    name: mis-gastos-demo
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mis-gastos-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: mis-gastos-db
    plan: free
    databaseName: misgastos
    user: misgastos
